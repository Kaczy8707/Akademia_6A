  <!-- CZYSZCZENIE STAREGO CACHE -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => { for(let r of regs) r.unregister(); });
    }
    if ('caches' in window) {
      caches.keys().then(names => { for(let n of names) caches.delete(n); });
    }
  </script>

  <!-- EKRAN LOGOWANIA -->
  <div id="authScreen" style="display: flex;" class="fixed inset-0 bg-indigo-950 bg-opacity-95 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center">
      <div class="text-5xl mb-3">⚡</div>
      <h1 class="text-3xl font-black text-indigo-950 mb-1">AKADEMIA 6A</h1>
      <p class="text-slate-500 text-sm mb-6" id="authSubtitle">Wpisz swój Nick i PIN, aby dołączyć!</p>

      <div id="loginForm" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nick ucznia:</label>
          <input type="text" id="userNick" placeholder="Np. Karol_SP7" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">PIN (4 cyfry):</label>
          <input type="password" id="userPin" maxlength="4" placeholder="****" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800 text-center tracking-widest">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Pytanie bezpieczeństwa (opcjonalne):</label>
          <select id="secQuestion" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-semibold text-xs text-slate-700 focus:outline-none mb-2">
            <option value="pet">Imię pierwszego zwierzaka?</option>
            <option value="color">Twój ulubiony kolor?</option>
            <option value="hero">Twój ulubiony superbohater?</option>
          </select>
          <input type="text" id="secAnswer" placeholder="Odpowiedź..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-xs text-slate-800">
        </div>
        
        <button type="button" onclick="forceLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-extrabold py-4 rounded-xl shadow-lg transition text-center block mt-4 cursor-pointer">
          ROZPOCZNIJ NAUKĘ 🚀
        </button>
        
        <div class="text-center mt-3">
          <button type="button" onclick="toggleRecovery(true)" class="text-xs text-indigo-600 hover:underline font-bold">Zapomniałeś PIN-u?</button>
        </div>
      </div>

      <div id="recoveryForm" class="space-y-4 text-left hidden">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Wpisz swój Nick:</label>
          <input type="text" id="recNick" placeholder="Twój Nick" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Odpowiedź na pytanie bezpieczeństwa:</label>
          <input type="text" id="recAnswer" placeholder="Wpisz odpowiedź..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Ustal NOWY PIN (4 cyfry):</label>
          <input type="password" id="recNewPin" maxlength="4" placeholder="****" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800 text-center tracking-widest">
        </div>
        <button type="button" onclick="resetPin()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition text-center block mt-2 cursor-pointer">
          ZMIEŃ PIN I ZALOGUJ 🔑
        </button>
        <div class="text-center mt-2">
          <button type="button" onclick="toggleRecovery(false)" class="text-xs text-slate-500 hover:underline font-bold">Powrót do logowania</button>
        </div>
      </div>

    </div>
  </div>

  <!-- NAGŁÓWEK -->
  <header class="bg-indigo-950 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2 cursor-pointer" onclick="showDashboard()">
        <span class="text-2xl">⚡</span>
        <span class="font-black tracking-wider text-lg">AKADEMIA 6A</span>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1 bg-amber-500/20 border border-amber-400 px-3 py-1 rounded-full text-amber-300 font-extrabold text-sm">
          🔥 <span id="streakDisplay">1</span> d.
        </div>
        <div class="flex items-center gap-1 bg-indigo-800/60 border border-indigo-400 px-3 py-1 rounded-full text-amber-300 font-extrabold text-sm">
          ⭐ <span id="xpDisplay">0</span> XP
        </div>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-600 font-bold">
          ⚙️ <span id="profileNick">Uczeń</span>

      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">

    <div id="dashboardView">
      <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-extrabold text-amber-900 flex items-center gap-2">
            🏆 LIGA KLASY 6A (TOP LIDERZY)
          </h2>
          <span class="text-xs text-amber-700 font-bold">Chmura Firebase</span>
        </div>
        <div id="leaderboard" class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
          <div class="bg-white p-3 rounded-xl border border-amber-200 text-center font-bold text-slate-500 col-span-3">
            Ładowanie wyników klasy 6A...
          </div>
        </div>

        <button onclick="openChallengeModal()" class="w-full bg-gradient-to-r from-red-500 to-amber-500 hover:from-red-600 hover:to-amber-600 text-white font-black py-3 rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
          ⚔️ Wyzwanie 1 vs 1 (Pojedynek z kolegą)
        </button>
      </div>

      <div id="activeChallengesContainer" class="hidden mb-6 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <h3 class="font-black text-slate-800 mb-3 text-sm flex items-center gap-2">
          🎯 RZUCONE WYZWANIA 1 vs 1 INNYCH GRACZY:
        </h3>
        <div id="challengesList" class="space-y-2"></div>
      </div>

      <h2 class="text-xl font-black text-slate-800 mb-4">Wybierz przedmiot do nauki:</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8" id="subjectGrid"></div>
    </div>

    <!-- MODAL WYZWANIA -->
    <div id="challengeModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-black text-lg text-slate-800">⚔️ Rzuć Wyzwanie 1 vs 1</h3>
          <button onclick="closeChallengeModal()" class="text-slate-400 font-bold text-lg">✕</button>
        </div>
        
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Kogo wyzywasz?</label>
            <select id="opponentSelect" class="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none"></select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Przedmiot pojedynku:</label>
            <select id="challengeSubject" class="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none">
              <option value="matematyka">📐 Matematyka</option>
              <option value="angielski">🇬🇧 Język Angielski</option>
              <option value="historia">⚔️ Historia</option>
              <option value="geografia">🌍 Geografia</option>
              <option value="biologia">🌿 Biologia</option>
              <option value="technika">🛠️ Technika</option>
            </select>
          </div>
          <button onclick="createChallenge()" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3.5 rounded-xl shadow-md transition active:scale-95 text-center mt-2">
            WYŚLIJ WYZWANIE (+50 XP DO ZDOBYCIA)
          </button>
        </div>
      </div>
    </div>

    <!-- WIDOK DZIAŁU -->
    <div id="chapterView" class="hidden">
      <button onclick="showDashboard()" class="mb-4 bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2">
        ← Powrót do przedmiotów
      </button>
      <h2 id="chapterTitle" class="text-2xl font-extrabold text-slate-800 mb-4"></h2>
      <div id="chapterList" class="space-y-3"></div>
    </div>

    <!-- WIDOK QUIZU -->
    <div id="quizView" class="hidden max-w-xl mx-auto bg-white rounded-3xl p-6 shadow-lg border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <button onclick="showDashboard()" class="text-slate-400 font-bold text-sm">✕ Wyjdź</button>
        <div class="w-2/3 bg-slate-200 h-3 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <div id="questionContainer" class="py-4"></div>
      <div id="feedbackBox" class="hidden p-4 rounded-2xl mb-4 font-bold text-sm text-center"></div>

      <button id="nextBtn" onclick="submitAnswer()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-xl shadow-md transition active:scale-95 text-center">
        SPRAWDŹ ODPOWIEDŹ
      </button>
    </div>

  </main>

  <script>
    let currentUser = null;
    let userStats = { xp: 0, streak: 1 };
    let currentQuiz = [];
    let currentQIdx = 0;
    let selectedOption = null;
    let isChallengeMode = false;
    let activeChallengeId = null;

    const program = {
      matematyka: { 
        title: 'Matematyka', icon: '📐', 
        chapters: [
          'Liczby naturalne i ułamki dziesiętne', 
          'Ułamki zwykłe i ich działania', 
          'Prędkość, droga, czas', 
          'Pola wielokątów (kwadrat, trójkąt, trapez)', 
          'Liczby dodatnie i ujemne',
          'Równania z jedną niewiadomą',
          'Bryły – pola powierzchni i objętość'
        ] 
      },
      angielski: { 
        title: 'Język Angielski', icon: '🇬🇧', 
        chapters: [
          'Podstawowe Słownictwo i Opis Osobisty', 
          'Present Simple vs Present Continuous', 
          'Past Simple (Czasowniki nieregularne)', 
          'Present Perfect',
          'Stopniowanie przymiotników',
          'Shopping & Food (Zakupy i Jedzenie)'
        ] 
      },
      historia: { 
        title: 'Historia', icon: '⚔️', 
        chapters: [
          'Narodziny nowożytnego świata (Wielkie odkrycia)', 
          'W Rzeczypospolitej szlacheckiej', 
          'Rzeczpospolita w XVII wieku (Potop szwedzki)',
          'Europa w XVIII wieku i Oświecenie',
          'Upadek Rzeczypospolitej (Rozbiory Polski)',
          'Rewolucja francuska i epoka napoleońska'
        ] 
      },
      geografia: { 
        title: 'Geografia', icon: '🌍', 
        chapters: [
          'Współrzędne geograficzne i czytanie mapy', 
          'Ruchy Ziemi (obrotowy i obiegowy)', 
          'Środowisko przyrodnicze Polski',
          'Sąsiedzi Polski – charakterystyka krajów',
          'Geografia Europy – kraje i krajobrazy'
        ] 
      },
      biologia: { 
        title: 'Biologia', icon: '🌿', 
        chapters: [
          'Świat zwierząt i klasyfikacja', 
          'Stawonogi i mięczaki', 
          'Ryby, płazy i gady',
          'Ptaki i ssaki – stałocieplność',
          'Ekologia i ochrona środowiska'
        ] 
      },
      technika: { 
        title: 'Technika', icon: '🛠️', 
        chapters: [
          'Rysunek techniczny i wymiarowanie', 
          'Materiały i tworzywa sztuczne', 
          'Elektronika i obwody elektryczne',
          'Karta rowerowa i znaki drogowe'
        ] 
      }
    };

    window.onload = function() {
      try {
        const savedUser = localStorage.getItem('akademia6a_saved_user');
        if (savedUser) {
          currentUser = JSON.parse(savedUser);
          document.getElementById('authScreen').style.display = 'none';
          initDashboard();
        }
      } catch(e) {}
      renderSubjects();
    };

    function toggleRecovery(show) {
      document.getElementById('loginForm').classList.toggle('hidden', show);
      document.getElementById('recoveryForm').classList.toggle('hidden', !show);
      document.getElementById('authSubtitle').innerText = show ? "Resetowanie PIN-u konta" : "Wpisz swój Nick i PIN, aby dołączyć!";
    }

    function forceLogin() {
      const n = document.getElementById('userNick').value.trim();
      const p = document.getElementById('userPin').value.trim();
      const a = document.getElementById('secAnswer').value.trim().toLowerCase();

      if (!n || !p) {
        alert("Wpisz Nick i PIN!");
        return;
      }

      currentUser = { nick: n, pin: p };

      try {
        localStorage.setItem('akademia6a_saved_user', JSON.stringify(currentUser));
      } catch(e) {}

      document.getElementById('authScreen').style.display = 'none';
      initDashboard();

      if (db) {
        db.collection("users_6a").doc(n).set({
          nick: n, pin: p, secAnswer: a, xp: 0, updatedAt: new Date()
        }, { merge: true }).catch(err => {});
      }
    }

    function resetPin() {
      const nick = document.getElementById('recNick').value.trim();
      const ans = document.getElementById('recAnswer').value.trim().toLowerCase();
      const newPin = document.getElementById('recNewPin').value.trim();

      if (!nick || !ans || newPin.length < 4) {
        alert("Wpisz Nick, odpowiedź i nowy 4-cyfrowy PIN!");
        return;
      }

      if (db) {
        db.collection("users_6a").doc(nick).get().then((doc) => {
          if (!doc.exists) { alert("Nie znaleziono takiego Nicku!"); return; }
          const data = doc.data();
          if (data.secAnswer === ans) {
            db.collection("users_6a").doc(nick).update({ pin: newPin });
            alert("PIN zmieniony! Zaloguj się nowym PIN-em.");
            toggleRecovery(false);
          } else {
            alert("Błędna odpowiedź na pytanie bezpieczeństwa!");
          }
        }).catch(e => alert("Błąd połączenia."));
      }
    }

    function logout() {
      if (confirm("Czy chcesz się wylogować?")) {
        try { localStorage.removeItem('akademia6a_saved_user'); } catch(e) {}
        location.reload();
      }
    }

    function initDashboard() {
      if (!currentUser) return;
      document.getElementById('profileNick').innerText = currentUser.nick;
      loadUserCloudData();
      renderLeaderboard();
      listenChallenges();
    }

    function loadUserCloudData() {
      let localXP = 0;
      try { localXP = parseInt(localStorage.getItem(`xp_${currentUser.nick}`)) || 0; } catch(e) {}
      userStats.xp = localXP;
      document.getElementById('xpDisplay').innerText = userStats.xp;

      if (db) {
        db.collection("users_6a").doc(currentUser.nick).get().then((doc) => {
          if (doc.exists) {
            userStats.xp = Math.max(userStats.xp, doc.data().xp || 0);
            document.getElementById('xpDisplay').innerText = userStats.xp;
          }
        }).catch(e => {});
      }
    }

    function addXP(points) {
      userStats.xp += points;
      document.getElementById('xpDisplay').innerText = userStats.xp;
      try { localStorage.setItem(`xp_${currentUser.nick}`, userStats.xp); } catch(e) {}

      if (db && currentUser) {
        db.collection("users_6a").doc(currentUser.nick).update({
          xp: userStats.xp, updatedAt: new Date()
        }).catch(e => {});
      }
    }

    function renderLeaderboard() {
      const lb = document.getElementById('leaderboard');
      const oppSel = document.getElementById('opponentSelect');
      if (!db) {
        lb.innerHTML = `<div class="col-span-3 text-center text-slate-500 font-bold p-2">Tryb lokalny.</div>`;
        return;
      }

      db.collection("users_6a").orderBy("xp", "desc").onSnapshot((snapshot) => {
        lb.innerHTML = "";
        oppSel.innerHTML = "";
        let rank = 1;

        snapshot.forEach((doc) => {
          const u = doc.data();
          if (rank <= 3) {
            const medals = ["🥇", "🥈", "🥉"];
            lb.innerHTML += `
              <div class="bg-white p-3 rounded-xl border border-amber-200 flex items-center justify-between shadow-sm">
                <span class="font-black text-slate-800">${medals[rank-1] || rank + "."} ${u.nick}</span>
                <span class="font-extrabold text-indigo-600">${u.xp} XP</span>
              </div>
            `;
          }
          if (u.nick !== currentUser.nick) {
            oppSel.innerHTML += `<option value="${u.nick}">${u.nick}</option>`;
          }
          rank++;
        });
      }, (err) => {
        lb.innerHTML = `<div class="col-span-3 text-center text-slate-500 font-bold p-2">Wczytywanie wyników...</div>`;
      });
    }

    function openChallengeModal() { document.getElementById('challengeModal').classList.remove('hidden'); }
    function closeChallengeModal() { document.getElementById('challengeModal').classList.add('hidden'); }

    function createChallenge() {
      const target = document.getElementById('opponentSelect').value;
      const subj = document.getElementById('challengeSubject').value;

      if (!target) { alert("Brak dostępnych przeciwników!"); return; }

      if (db) {
        db.collection("challenges_6a").add({
          from: currentUser.nick, to: target, subject: subj, status: 'pending', createdAt: new Date()
        }).then(() => {
          alert(`Wyzwanie 1 vs 1 dla ${target} wysłane!`);
          closeChallengeModal();
        });
      }
    }

    function listenChallenges() {
      if (!db) return;
      db.collection("challenges_6a").where("to", "==", currentUser.nick).where("status", "==", "pending")
        .onSnapshot((snapshot) => {
          const container = document.getElementById('activeChallengesContainer');
          const list = document.getElementById('challengesList');
          if (snapshot.empty) { container.classList.add('hidden'); return; }

          container.classList.remove('hidden');
          list.innerHTML = "";
          snapshot.forEach((doc) => {
            const ch = doc.data();
            list.innerHTML += `
              <div class="flex justify-between items-center bg-red-50 p-3 rounded-xl border border-red-200">
                <span class="font-bold text-sm text-red-900">⚔️ ${ch.from} wyzwał Cię z: ${program[ch.subject].title}!</span>
                <button onclick="acceptChallenge('${doc.id}', '${ch.subject}')" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-2 rounded-lg shadow">
                  Graj (+50 XP)
                </button>
              </div>
            `;
          });
        });
    }

    function acceptChallenge(id, subjKey) {
      activeChallengeId = id;
      isChallengeMode = true;
      startQuiz(`Pojedynek 1 vs 1: ${program[subjKey].title}`, subjKey);
    }

    function renderSubjects() {
      const grid = document.getElementById('subjectGrid');
      grid.innerHTML = "";
      for (let key in program) {
        const s = program[key];
        grid.innerHTML += `
          <button onclick="openSubject('${key}')" class="bg-white border border-slate-200 hover:border-indigo-500 p-6 rounded-2xl shadow-sm hover:shadow-md transition active:scale-95 text-center flex flex-col items-center">
            <span class="text-5xl mb-2">${s.icon}</span>
            <span class="font-bold text-slate-800 text-sm">${s.title}</span>
          </button>
        `;
      }
    }

    function showDashboard() {
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('chapterView').classList.add('hidden');
      document.getElementById('quizView').classList.add('hidden');
    }

    let activeSubjectKey = '';
    function openSubject(key) {
      activeSubjectKey = key;
      const subj = program[key];
      document.getElementById('chapterTitle').innerText = subj.title;
      const list = document.getElementById('chapterList');
      list.innerHTML = "";

      subj.chapters.forEach(chap => {
        list.innerHTML += `
          <div onclick="startQuiz('${chap}', '${key}')" class="bg-white p-4 rounded-2xl border border-slate-200 hover:border-indigo-500 shadow-sm cursor-pointer flex justify-between items-center font-bold">
            <span>${chap}</span>
            <span class="text-indigo-600">Rozpocznij ▶</span>
          </div>
        `;
      });

      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('chapterView').classList.remove('hidden');
    }

    // ==========================================
    // GENERATOR ZADAŃ DLA DOWOLNEGO DZIAŁU
    // ==========================================
    function generateQuestionsForChapter(chapterName, subjKey) {
      let qList = [];

      // MATEMATYKA
      if (subjKey === 'matematyka') {
        if (chapterName.includes('Prędkość')) {
          let v = (Math.floor(Math.random() * 6) + 4) * 10; // 40..90 km/h
          let t = Math.floor(Math.random() * 3) + 2; // 2..4 h
          let s = v * t;
          qList.push({ q: `Pojazd porusza się ze stałą prędkością ${v} km/h. Jaką drogę pokona w czasie ${t} godzin?`, options: [`${s} km`, `${s + 20} km`, `${s - 15} km`], a: `${s} km` });
          qList.push({ q: `Pociąg pokonał drogę 180 km w czasie 3 godzin. Z jaką średnią prędkością jechał?`, options: ["60 km/h", "50 km/h", "70 km/h"], a: "60 km/h" });
          qList.push({ q: `Rowerzysta jedzie z prędkością 15 km/h. Ile kilometrów przejedzie w ciągu 4 godzin?`, options: ["60 km", "45 km", "50 km"], a: "60 km" });
        } else if (chapterName.includes('Pola wielokątów')) {
          let a = Math.floor(Math.random() * 6) + 4;
          let b = Math.floor(Math.random() * 5) + 3;
          let p = a * b;
          qList.push({ q: `Oblicz pole prostokąta o bokach długości a = ${a} cm oraz b = ${b} cm:`, options: [`${p} cm²`, `${(a+b)*2} cm²`, `${p + 6} cm²`], a: `${p} cm²` });
          qList.push({ q: `Kwadrat ma bok o długości 8 cm. Ile wynosi jego pole powierzchni?`, options: ["64 cm²", "32 cm²", "16 cm²"], a: "64 cm²" });
          qList.push({ q: `Trójkąt ma podstawę a = 10 cm i wysokość h = 6 cm. Oblicz jego pole (P = a·h / 2):`, options: ["30 cm²", "60 cm²", "16 cm²"], a: "30 cm²" });
        } else if (chapterName.includes('Równania')) {
          let x = Math.floor(Math.random() * 8) + 2;
          let add = Math.floor(Math.random() * 10) + 5;
          let res = x + add;
          qList.push({ q: `Rozwiąż równanie z jedną niewiadomą: x + ${add} = ${res}`, options: [`x = ${x}`, `x = ${x + 2}`, `x = ${res}`], a: `x = ${x}` });
          qList.push({ q: `Rozwiąż równanie: 3x = 21`, options: ["x = 7", "x = 6", "x = 8"], a: "x = 7" });
          qList.push({ q: `Jaka wartość x spełnia równanie: 2x + 4 = 14?`, options: ["x = 5", "x = 4", "x = 6"], a: "x = 5" });
        } else {
          qList.push({ q: `Oblicz wartość wyrażenia: 3/4 + 2/4`, options: ["5/4 (1 i 1/4)", "5/8", "1"], a: "5/4 (1 i 1/4)" });
          qList.push({ q: `Zaokrąglij ułamek dziesiętny 4,378 do części setnych:`, options: ["4,38", "4,37", "4,40"], a: "4,38" });
          qList.push({ q: `Ile wynosi wynik mnożenia: 0,5 · 0,4?`, options: ["0,2", "0,02", "2,0"], a: "0,2" });
        }
      } 
      
      // GEOGRAFIA (Z MAPAMI)
      else if (subjKey === 'geografia') {
        if (chapterName.includes('czytanie mapy') || chapterName.includes('Współrzędne')) {
          qList.push({ 
            q: "Na poniższej konturowej mapie Europy wskaż położenie Polski (Europa Środkowa):", 
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/BlankMap-Europe-v2.svg/640px-BlankMap-Europe-v2.svg.png",
            options: ["Obszar w centrum (Europy Środkowej)", "Obszar na południu (Półwysep Apeniński)", "Półwysep Iberyjski na zachodzie"], 
            a: "Obszar w centrum (Europy Środkowej)" 
          });
          qList.push({ q: "Które linie na globusie zbiegają się na biegunach?", options: ["Południki", "Równoleżniki", "Równik"], a: "Południki" });
          qList.push({ q: "Równoleżnik o szerokości geograficznej 0° to:", options: ["Równik", "Zwrotnik Raka", "Południk zerowy"], a: "Równik" });
        } else if (chapterName.includes('Ruchy Ziemi')) {
          qList.push({ 
            q: "Przeanalizuj schemat oświetlenia Ziemi. Ruch obiegowy Ziemi wokół Słońca (365 dni) odpowiada za:", 
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/North_season.jpg/640px-North_season.jpg",
            options: ["Pory roku", "Dzień i noc", "Spłaszczenie Ziemi na biegunach"], 
            a: "Pory roku" 
          });
          qList.push({ q: "Ile czasu trwa pełny obrót Ziemi wokół własnej osi (ruch obrotowy)?", options: ["24 godziny (1 doba)", "365 dni", "30 dni"], a: "24 godziny (1 doba)" });
        } else {
          qList.push({ 
            q: "Spójrz na fizyczną mapę Polski. Najważniejsza i najdłuższa rzeka w Polsce to:", 
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Relief_Map_of_Poland.svg/640px-Relief_Map_of_Poland.svg.png",
            options: ["Wisła", "Odra", "Warta"], 
            a: "Wisła" 
          });
          qList.push({ q: "Najwyższy szczyt w polskich Tatrach to:", options: ["Rysy (2499 m n.p.m.)", "Giewont", "Śnieżka"], a: "Rysy (2499 m n.p.m.)" });
        }
      }

      // BIOLOGIA (ZE SCHEMATAMI)
      else if (subjKey === 'biologia') {
        if (chapterName.includes('Stawonogi')) {
          qList.push({ 
            q: "Rozpoznaj przedstawiciela stawonogów ze zdjęcia. Do której grupy bezkręgowców należy pająk?", 
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Araneus_diadematus_2007-08-11.jpg/640px-Araneus_diadematus_2007-08-11.jpg",
            options: ["Pajęczaki (4 pary odnóży)", "Owady (3 pary odnóży)", "Skorupiaki"], 
            a: "Pajęczaki (4 pary odnóży)" 
          });
          qList.push({ q: "Ile par odnóży krocznych posiadają owady (np. pszczoła, mrówka)?", options: ["3 pary (6 odnóży)", "4 pary (8 odnóży)", "5 par"], a: "3 pary (6 odnóży)" });
        } else if (chapterName.includes('Ptaki')) {
          qList.push({ 
            q: "Przeanalizuj budowę ciała ptaka. Co umożliwia ptakom lot w powietrzu?", 
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Eurasian_blue_tit_kipt.jpg/640px-Eurasian_blue_tit_kipt.jpg",
            options: ["Aromatyczne kości pneumatyczne i pióra", "Ciężki szkielet i gruba skóra", "Płetwy i skrzela"], 
            a: "Aromatyczne kości pneumatyczne i pióra" 
          });
          qList.push({ q: "Zwierzęta stałocieplne to:", options: ["Ptaki i ssaki", "Ryby i płazy", "Gady i owady"], a: "Ptaki i ssaki" });
        } else {
          qList.push({ q: "Które z wymienionych zwierząt jest płazem?", options: ["Żaba trawna", "Jaszczurka zwinka", "Zaskroniec"], a: "Żaba trawna" });
          qList.push({ q: "Pokrycie ciała gadów stanowią:", options: ["Suche łuski i tarczki", "Wilgotna skóra z śluzem", "Pióra i puch"], a: "Suche łuski i tarczki" });
        }
      }

      // HISTORIA (Z GRAFIKAMI)
      else if (subjKey === 'historia') {
        if (chapterName.includes('Wielkie odkrycia')) {
          qList.push({ 
            q: "Na obrazie przedstawiono Krzysztofa Kolumba. W którym roku odkrył on Amerykę?", 
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Christopher_Columbus.JPG/640px-Christopher_Columbus.JPG",
            options: ["1492 rok", "1410 rok", "1569 rok"], 
            a: "1492 rok" 
          });
          qList.push({ q: "Kto dowodził pierwszą wyprawą, która opłynęła Ziemię wokół?", options: ["Ferdynand Magellan", "Vasco da Gama", "Krzysztof Kolumb"], a: "Ferdynand Magellan" });
        } else if (chapterName.includes('Potop') || chapterName.includes('XVII')) {
          qList.push({ 
            q: "Obraz przedstawia obronę Jasnej Góry podczas potopu. Z jakim państwem walczyła Rzeczpospolita?", 
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Jasna_G%C3%B3ra_1655.jpg/640px-Jasna_G%C3%B3ra_1655.jpg",
            options: ["Szwecja", "Rosja", "Turcja"], 
            a: "Szwecja" 
          });
          qList.push({ q: "Słynny polski król, który odniósł zwycięstwo pod Wiedniem w 1683 r. to:", options: ["Jan III Sobieski", "Zygmunt III Waza", "Kazimierz Wielki"], a: "Jan III Sobieski" });
        } else {
          qList.push({ q: "Konstytucja 3 maja została uchwalona w roku:", options: ["1791", "1772", "1795"], a: "1791" });
          qList.push({ q: "Polski bohater narodowy, przywódca powstania z 1794 roku to:", options: ["Tadeusz Kościuszko", "Józef Poniatowski", "Jan Henryk Dąbrowski"], a: "Tadeusz Kościuszko" });
        }
      }

      // TECHNIKA (ZE SCHEMATAMI)
      else if (subjKey === 'technika') {
        if (chapterName.includes('znaki drogowe') || chapterName.includes('rowerowa')) {
          qList.push({ 
            q: "Spójrz na poniższy znak drogowy. Co oznacza niebieski okrągły znak z rowerem?", 
            image: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Znak_C-13.svg/480px-Znak_C-13.svg.png",
            options: ["Droga dla rowerów (nakaz)", "Zakaz wjazdu rowerów", "Ostrzeżenie o rowerzystach"], 
            a: "Droga dla rowerów (nakaz)" 
          });
          qList.push({ q: "Kto ma pierwszeństwo na skrzyżowaniu równorzędnym?", options: ["Pojazd nadjeżdżający z prawej strony", "Pojazd jadący szybciej", "Pojazd nadjeżdżający z lewej strony"], a: "Pojazd nadjeżdżający z prawej strony" });
        } else {
          qList.push({ q: "Rysunek techniczny w liniach przerywanych przedstawia:", options: ["Krawędzie niewidoczne", "Główne krawędzie obiektu", "Oś symetrii"], a: "Krawędzie niewidoczne" });
          qList.push({ q: "Jaki materiał jest dobrym przewodnikiem elektryczności?", options: ["Miedź i glin (metale)", "Drewno i plastik", "Szkło i guma"], a: "Miedź i glin (metale)" });
        }
      }

      // ANGIELSKI
      else {
        if (chapterName.includes('Past Simple')) {
          qList.push({ q: "Wybierz poprawną formę czasu przeszłego (Past Simple) dla czasownika 'GO':", options: ["went", "gone", "goed"], a: "went" });
          qList.push({ q: "Wpisz po angielsku formę przeszłą od 'SEE' (widzieć):", isOpen: true, a: "saw" });
          qList.push({ q: "Forma przeszła od czasownika 'BUY' to:", options: ["bought", "buyed", "bring"], a: "bought" });
        } else {
          qList.push({ q: "Przetłumacz na język angielski słowo 'Pies':", isOpen: true, a: "dog" });
          qList.push({ q: "Wybierz poprawne dokończenie zdania: She ___ reading a book right now.", options: ["is", "are", "am"], a: "is" });
          qList.push({ q: "Przeciwieństwem słowa 'BIG' (duży) jest:", options: ["small", "tall", "fast"], a: "small" });
        }
      }

      return qList;
    }

    function startQuiz(chapterName, subjKey) {
      currentQuiz = generateQuestionsForChapter(chapterName, subjKey || activeSubjectKey);
      currentQIdx = 0;
      
      document.getElementById('chapterView').classList.add('hidden');
      document.getElementById('quizView').classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      selectedOption = null;
      document.getElementById('feedbackBox').classList.add('hidden');
      const q = currentQuiz[currentQIdx];
      
      const pct = ((currentQIdx) / currentQuiz.length) * 100;
      document.getElementById('progressBar').style.width = pct + "%";

      const container = document.getElementById('questionContainer');
      let imgHtml = q.image ? `<img src="${q.image}" class="w-full max-h-52 object-contain rounded-2xl mb-4 border border-slate-200 shadow-sm bg-slate-50 p-2">` : '';

      container.innerHTML = `
        <h3 class="text-lg font-black text-slate-800 mb-3">${q.q}</h3>
        ${imgHtml}
      `;

      if (q.isOpen) {
        container.innerHTML += `
          <input type="text" id="openAns" placeholder="Wpisz odpowiedź..." class="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold focus:outline-none focus:border-indigo-600">
        `;
      } else {
        q.options.forEach(opt => {
          container.innerHTML += `
            <button onclick="selectOpt(this, '${opt}')" class="opt-btn w-full text-left p-4 rounded-xl border border-slate-200 font-bold mb-2 hover:bg-indigo-50 transition">
              ${opt}
            </button>
          `;
        });
      }

      document.getElementById('nextBtn').innerText = "SPRAWDŹ ODPOWIEDŹ";
      document.getElementById('nextBtn').onclick = submitAnswer;
    }

    function selectOpt(btn, opt) {
      document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('border-indigo-600', 'bg-indigo-50'));
      btn.classList.add('border-indigo-600', 'bg-indigo-50');
      selectedOption = opt;
    }

    function submitAnswer() {
      const q = currentQuiz[currentQIdx];
      let userAns = q.isOpen ? document.getElementById('openAns').value.trim().toLowerCase() : selectedOption;

      if (!userAns) {
        alert("Wybierz lub wpisz odpowiedź!");
        return;
      }

      const fb = document.getElementById('feedbackBox');
      fb.classList.remove('hidden');

      if (userAns.toLowerCase() === q.a.toLowerCase()) {
        fb.className = "p-4 rounded-2xl mb-4 font-bold text-sm text-center bg-emerald-100 text-emerald-800 border border-emerald-300";
        fb.innerText = "🎉 Świetnie! Poprawna odpowiedź!";
        addXP(10);
      } else {
        fb.className = "p-4 rounded-2xl mb-4 font-bold text-sm text-center bg-rose-100 text-rose-800 border border-rose-300";
        fb.innerText = `❌ Pomyłka! Prawidłowa odpowiedź to: ${q.a}`;
      }

      document.getElementById('nextBtn').innerText = "NASTĘPNE ZADANIE ▶";
      document.getElementById('nextBtn').onclick = nextQuestion;
    }

    function nextQuestion() {
      currentQIdx++;
      if (currentQIdx < currentQuiz.length) {
        renderQuestion();
      } else {
        if (isChallengeMode) {
          addXP(50);
          if (db && activeChallengeId) {
            db.collection("challenges_6a").doc(activeChallengeId).update({ status: 'completed' });
          }
          alert("🏆 Wyzwanie 1 vs 1 zakończone sukcesem! Zdobycz: +50 BONUSOWYCH XP!");
          isChallengeMode = false;
        } else {
          alert("Gratulacje! Ukończyłeś test z tego działu!");
        }
        showDashboard();
      }
    }
  </script>
