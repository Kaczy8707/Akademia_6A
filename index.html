<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akademia 6A</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Akademia 6A">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col select-none">

  <!-- KONFIGURACJA FIREBASE -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDpe9cwQywFTFzNoC6ovSPAzLjS8_pjsRQ",
      authDomain: "akademia-6a.firebaseapp.com",
      projectId: "akademia-6a",
      storageBucket: "akademia-6a.firebasestorage.app",
      messagingSenderId: "547146287604",
      appId: "1:547146287604:web:53c5efa8b29383a77dd1a1"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {
      console.log("Firebase offline");
    }
  </script>

  <!-- EKRAN LOGOWANIA -->
  <div id="authScreen" class="fixed inset-0 bg-indigo-950 bg-opacity-95 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center">
      <div class="text-5xl mb-3">⚡</div>
      <h1 class="text-3xl font-black text-indigo-950 mb-1">AKADEMIA 6A</h1>
      <p class="text-slate-500 text-sm mb-6">Wpisz swój Nick i PIN, aby dołączyć!</p>

      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nick ucznia:</label>
          <input type="text" id="userNick" placeholder="Np. Karol_SP7" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">PIN (4 cyfry):</label>
          <input type="password" id="userPin" maxlength="4" placeholder="****" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800 text-center tracking-widest">
        </div>
        <button type="button" id="startBtn" onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition active:scale-95 text-center block mt-4">
          ROZPOCZNIJ NAUKĘ 🚀
        </button>
      </div>
    </div>
  </div>

  <!-- NAGŁÓWEK GŁÓWNY -->
  <header class="bg-indigo-950 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2 cursor-pointer" onclick="showDashboard()">
        <span class="text-2xl">⚡</span>
        <span class="font-black tracking-wider text-lg">AKADEMIA 6A</span>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1 bg-amber-500/20 border border-amber-400 px-3 py-1 rounded-full text-amber-300 font-extrabold text-sm">
          🔥 <span id="streakDisplay">1</span> d.
        </div>
        <div class="flex items-center gap-1 bg-indigo-800/60 border border-indigo-400 px-3 py-1 rounded-full text-amber-300 font-extrabold text-sm">
          ⭐ <span id="xpDisplay">0</span> XP
        </div>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-600 font-bold">
          ⚙️ <span id="profileNick">Uczeń</span>
        </button>
      </div>
    </div>
  </header>

  <!-- KONTENER GŁÓWNY -->
  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">

    <div id="dashboardView">
      <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-extrabold text-amber-900 flex items-center gap-2">
            🏆 LIGA KLASY 6A (TOP LIDERZY)
          </h2>
          <span class="text-xs text-amber-700 font-bold">Chmura Firebase</span>
        </div>
        <div id="leaderboard" class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
          <div class="bg-white p-3 rounded-xl border border-amber-200 text-center font-bold text-slate-500 col-span-3">
            Ładowanie wyników klasy 6A...
          </div>
        </div>

        <button onclick="openChallengeModal()" class="w-full bg-gradient-to-r from-red-500 to-amber-500 hover:from-red-600 hover:to-amber-600 text-white font-black py-3 rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
          ⚔️ Wyzwanie 1 vs 1 (Pojedynek z kolegą)
        </button>
      </div>

      <div id="activeChallengesContainer" class="hidden mb-6 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <h3 class="font-black text-slate-800 mb-3 text-sm flex items-center gap-2">
          🎯 RZUCONE WYZWANIA 1 vs 1 INNYCH GRACZY:
        </h3>
        <div id="challengesList" class="space-y-2"></div>
      </div>

      <h2 class="text-xl font-black text-slate-800 mb-4">Wybierz przedmiot do nauki:</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8" id="subjectGrid"></div>
    </div>

    <!-- MODAL TWORZENIA WYZWANIA -->
    <div id="challengeModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-black text-lg text-slate-800">⚔️ Rzuć Wyzwanie 1 vs 1</h3>
          <button onclick="closeChallengeModal()" class="text-slate-400 font-bold text-lg">✕</button>
        </div>
        
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Kogo wyzywasz?</label>
            <select id="opponentSelect" class="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none"></select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Przedmiot pojedynku:</label>
            <select id="challengeSubject" class="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none">
              <option value="angielski">🇬🇧 Język Angielski</option>
              <option value="matematyka">📐 Matematyka</option>
              <option value="historia">⚔️ Historia</option>
              <option value="geografia">🌍 Geografia</option>
              <option value="biologia">🌿 Biologia</option>
              <option value="technika">🛠️ Technika</option>
            </select>
          </div>
          <button onclick="createChallenge()" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3.5 rounded-xl shadow-md transition active:scale-95 text-center mt-2">
            WYŚLIJ WYZWANIE (+50 XP DO ZDOBYCIA)
          </button>
        </div>
      </div>
    </div>

    <!-- WIDOK WYBORU DZIAŁU -->
    <div id="chapterView" class="hidden">
      <button onclick="showDashboard()" class="mb-4 bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2">
        ← Powrót do przedmiotów
      </button>
      <h2 id="chapterTitle" class="text-2xl font-extrabold text-slate-800 mb-4"></h2>
      <div id="chapterList" class="space-y-3"></div>
    </div>

    <!-- WIDOK QUIZU -->
    <div id="quizView" class="hidden max-w-xl mx-auto bg-white rounded-3xl p-6 shadow-lg border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <button onclick="showDashboard()" class="text-slate-400 font-bold text-sm">✕ Wyjdź</button>
        <div class="w-2/3 bg-slate-200 h-3 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <div id="questionContainer" class="py-4"></div>
      <div id="feedbackBox" class="hidden p-4 rounded-2xl mb-4 font-bold text-sm text-center"></div>

      <button id="nextBtn" onclick="submitAnswer()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-xl shadow-md transition active:scale-95 text-center">
        SPRAWDŹ ODPOWIEDŹ
      </button>
    </div>

  </main>

  <script>
    let currentUser = null;
    let userStats = { xp: 0, streak: 1 };
    let currentQuiz = [];
    let currentQIdx = 0;
    let selectedOption = null;
    let isChallengeMode = false;
    let activeChallengeId = null;

    const program = {
      angielski: { title: 'Język Angielski', icon: '🇬🇧', chapters: ['Podstawowe Słownictwo', 'Present Simple', 'Past Simple', 'Present Perfect'] },
      matematyka: { title: 'Matematyka', icon: '📐', chapters: ['Liczby naturalne i ułamki', 'Prędkość, droga, czas', 'Pola wielokątów'] },
      historia: { title: 'Historia', icon: '⚔️', chapters: ['Narodziny nowożytnego świata', 'W Rzeczypospolitej szlacheckiej', 'Rewolucja francuska'] },
      geografia: { title: 'Geografia', icon: '🌍', chapters: ['Współrzędne geograficzne', 'Ruchy Ziemi', 'Sąsiedzi Polski'] },
      biologia: { title: 'Biologia', icon: '🌿', chapters: ['Świat zwierząt', 'Stawonogi i mięczaki', 'Kręgowce stałocieplne'] },
      technika: { title: 'Technika', icon: '🛠️', chapters: ['Technika w otoczeniu', 'Rysunek techniczny'] }
    };

    window.onload = function() {
      try {
        const savedUser = localStorage.getItem('akademia6a_saved_user');
        if (savedUser) {
          currentUser = JSON.parse(savedUser);
          document.getElementById('authScreen').style.display = 'none';
          initDashboard();
        }
      } catch(e) {}
      renderSubjects();
    };

    function handleLogin() {
      const nick = document.getElementById('userNick').value.trim();
      const pin = document.getElementById('userPin').value.trim();

      if (!nick || !pin) {
        alert("Wpisz Nick i PIN!");
        return;
      }

      currentUser = { nick, pin };

      try {
        localStorage.setItem('akademia6a_saved_user', JSON.stringify(currentUser));
      } catch(e) {}

      // Ukrywamy ekran natychmiast
      document.getElementById('authScreen').style.display = 'none';
      initDashboard();

      // Cicha wysyłka do Firebase
      if (db) {
        db.collection("users_6a").doc(nick).set({
          nick: nick,
          pin: pin,
          xp: 0,
          updatedAt: new Date()
        }, { merge: true }).catch(err => {});
      }
    }

    function logout() {
      if (confirm("Czy chcesz się wylogować?")) {
        try { localStorage.removeItem('akademia6a_saved_user'); } catch(e) {}
        location.reload();
      }
    }

    function initDashboard() {
      if (!currentUser) return;
      document.getElementById('profileNick').innerText = currentUser.nick;
      loadUserCloudData();
      renderLeaderboard();
      listenChallenges();
    }

    function loadUserCloudData() {
      let localXP = 0;
      try { localXP = parseInt(localStorage.getItem(`xp_${currentUser.nick}`)) || 0; } catch(e) {}
      userStats.xp = localXP;
      document.getElementById('xpDisplay').innerText = userStats.xp;

      if (db) {
        db.collection("users_6a").doc(currentUser.nick).get().then((doc) => {
          if (doc.exists) {
            userStats.xp = Math.max(userStats.xp, doc.data().xp || 0);
            document.getElementById('xpDisplay').innerText = userStats.xp;
          }
        }).catch(e => {});
      }
    }

    function addXP(points) {
      userStats.xp += points;
      document.getElementById('xpDisplay').innerText = userStats.xp;
      try { localStorage.setItem(`xp_${currentUser.nick}`, userStats.xp); } catch(e) {}

      if (db && currentUser) {
        db.collection("users_6a").doc(currentUser.nick).update({
          xp: userStats.xp,
          updatedAt: new Date()
        }).catch(e => {});
      }
    }

    function renderLeaderboard() {
      const lb = document.getElementById('leaderboard');
      const oppSel = document.getElementById('opponentSelect');
      if (!db) {
        lb.innerHTML = `<div class="col-span-3 text-center text-slate-500 font-bold p-2">Tryb lokalny.</div>`;
        return;
      }

      db.collection("users_6a").orderBy("xp", "desc").onSnapshot((snapshot) => {
        lb.innerHTML = "";
        oppSel.innerHTML = "";
        let rank = 1;

        snapshot.forEach((doc) => {
          const u = doc.data();
          if (rank <= 3) {
            const medals = ["🥇", "🥈", "🥉"];
            lb.innerHTML += `
              <div class="bg-white p-3 rounded-xl border border-amber-200 flex items-center justify-between shadow-sm">
                <span class="font-black text-slate-800">${medals[rank-1] || rank + "."} ${u.nick}</span>
                <span class="font-extrabold text-indigo-600">${u.xp} XP</span>
              </div>
            `;
          }
          if (u.nick !== currentUser.nick) {
            oppSel.innerHTML += `<option value="${u.nick}">${u.nick}</option>`;
          }
          rank++;
        });
      }, (err) => {
        lb.innerHTML = `<div class="col-span-3 text-center text-slate-500 font-bold p-2">Wczytywanie wyników...</div>`;
      });
    }

    function openChallengeModal() {
      document.getElementById('challengeModal').classList.remove('hidden');
    }

    function closeChallengeModal() {
      document.getElementById('challengeModal').classList.add('hidden');
    }

    function createChallenge() {
      const target = document.getElementById('opponentSelect').value;
      const subj = document.getElementById('challengeSubject').value;

      if (!target) {
        alert("Brak dostępnych przeciwników!");
        return;
      }

      if (db) {
        db.collection("challenges_6a").add({
          from: currentUser.nick,
          to: target,
          subject: subj,
          status: 'pending',
          createdAt: new Date()
        }).then(() => {
          alert(`Wyzwanie 1 vs 1 dla ${target} wysłane!`);
          closeChallengeModal();
        });
      }
    }

    function listenChallenges() {
      if (!db) return;
      db.collection("challenges_6a").where("to", "==", currentUser.nick).where("status", "==", "pending")
        .onSnapshot((snapshot) => {
          const container = document.getElementById('activeChallengesContainer');
          const list = document.getElementById('challengesList');
          if (snapshot.empty) {
            container.classList.add('hidden');
            return;
          }

          container.classList.remove('hidden');
          list.innerHTML = "";
          snapshot.forEach((doc) => {
            const ch = doc.data();
            list.innerHTML += `
              <div class="flex justify-between items-center bg-red-50 p-3 rounded-xl border border-red-200">
                <span class="font-bold text-sm text-red-900">⚔️ ${ch.from} wyzwał Cię z: ${program[ch.subject].title}!</span>
                <button onclick="acceptChallenge('${doc.id}', '${ch.subject}')" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-2 rounded-lg shadow">
                  Graj (+50 XP)
                </button>
              </div>
            `;
          });
        });
    }

    function acceptChallenge(id, subjKey) {
      activeChallengeId = id;
      isChallengeMode = true;
      startQuiz(`Pojedynek 1 vs 1: ${program[subjKey].title}`);
    }

    function renderSubjects() {
      const grid = document.getElementById('subjectGrid');
      grid.innerHTML = "";
      for (let key in program) {
        const s = program[key];
        grid.innerHTML += `
          <button onclick="openSubject('${key}')" class="bg-white border border-slate-200 hover:border-indigo-500 p-6 rounded-2xl shadow-sm hover:shadow-md transition active:scale-95 text-center flex flex-col items-center">
            <span class="text-5xl mb-2">${s.icon}</span>
            <span class="font-bold text-slate-800 text-sm">${s.title}</span>
          </button>
        `;
      }
    }

    function showDashboard() {
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('chapterView').classList.add('hidden');
      document.getElementById('quizView').classList.add('hidden');
    }

    function openSubject(key) {
      const subj = program[key];
      document.getElementById('chapterTitle').innerText = subj.title;
      const list = document.getElementById('chapterList');
      list.innerHTML = "";

      subj.chapters.forEach(chap => {
        list.innerHTML += `
          <div onclick="startQuiz('${chap}')" class="bg-white p-4 rounded-2xl border border-slate-200 hover:border-indigo-500 shadow-sm cursor-pointer flex justify-between items-center font-bold">
            <span>${chap}</span>
            <span class="text-indigo-600">Rozpocznij ▶</span>
          </div>
        `;
      });

      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('chapterView').classList.remove('hidden');
    }

    function startQuiz(chapterName) {
      currentQuiz = [
        { q: "Pojazd jedzie ze stałą prędkością 60 km/h przez 2 godziny. Jaką drogę pokona?", options: ["120 km", "100 km", "62 km"], a: "120 km" },
        { q: "Która odpowiedź jest prawidłowa dla wybranego zagadnienia?", options: ["Prawidłowa definicja z podręcznika", "Błędne pojęcie", "Inna odpowiedź"], a: "Prawidłowa definicja z podręcznika" },
        { q: "Wpisz po angielsku słowo 'Pies':", isOpen: true, a: "dog" }
      ];
      currentQIdx = 0;
      
      document.getElementById('chapterView').classList.add('hidden');
      document.getElementById('quizView').classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      selectedOption = null;
      document.getElementById('feedbackBox').classList.add('hidden');
      const q = currentQuiz[currentQIdx];
      
      const pct = ((currentQIdx) / currentQuiz.length) * 100;
      document.getElementById('progressBar').style.width = pct + "%";

      const container = document.getElementById('questionContainer');
      container.innerHTML = `<h3 class="text-lg font-black text-slate-800 mb-4">${q.q}</h3>`;

      if (q.isOpen) {
        container.innerHTML += `
          <input type="text" id="openAns" placeholder="Wpisz odpowiedź..." class="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold focus:outline-none focus:border-indigo-600">
        `;
      } else {
        q.options.forEach(opt => {
          container.innerHTML += `
            <button onclick="selectOpt(this, '${opt}')" class="opt-btn w-full text-left p-4 rounded-xl border border-slate-200 font-bold mb-2 hover:bg-indigo-50 transition">
              ${opt}
            </button>
          `;
        });
      }

      document.getElementById('nextBtn').innerText = "SPRAWDŹ ODPOWIEDŹ";
      document.getElementById('nextBtn').onclick = submitAnswer;
    }

    function selectOpt(btn, opt) {
      document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('border-indigo-600', 'bg-indigo-50'));
      btn.classList.add('border-indigo-600', 'bg-indigo-50');
      selectedOption = opt;
    }

    function submitAnswer() {
      const q = currentQuiz[currentQIdx];
      let userAns = q.isOpen ? document.getElementById('openAns').value.trim().toLowerCase() : selectedOption;

      if (!userAns) {
        alert("Wybierz lub wpisz odpowiedź!");
        return;
      }

      const fb = document.getElementById('feedbackBox');
      fb.classList.remove('hidden');

      if (userAns.toLowerCase() === q.a.toLowerCase()) {
        fb.className = "p-4 rounded-2xl mb-4 font-bold text-sm text-center bg-emerald-100 text-emerald-800 border border-emerald-300";
        fb.innerText = "🎉 Świetnie! Poprawna odpowiedź!";
        addXP(10);
      } else {
        fb.className = "p-4 rounded-2xl mb-4 font-bold text-sm text-center bg-rose-100 text-rose-800 border border-rose-300";
        fb.innerText = `❌ Pomyłka! Prawidłowa odpowiedź to: ${q.a}`;
      }

      document.getElementById('nextBtn').innerText = "NASTĘPNE ZADANIE ▶";
      document.getElementById('nextBtn').onclick = nextQuestion;
    }

    function nextQuestion() {
      currentQIdx++;
      if (currentQIdx < currentQuiz.length) {
        renderQuestion();
      } else {
        if (isChallengeMode) {
          addXP(50);
          if (db && activeChallengeId) {
            db.collection("challenges_6a").doc(activeChallengeId).update({ status: 'completed' });
          }
          alert("🏆 Wyzwanie 1 vs 1 zakończone sukcesem! Zdobycz: +50 BONUSOWYCH XP!");
          isChallengeMode = false;
        } else {
          alert("Gratulacje! Ukończyłeś test z tego działu!");
        }
        showDashboard();
      }
    }
  </script>
</body>
</html>
