      caches.keys().then(names => { for(let n of names) caches.delete(n); });
    }
  </script>

          'Narodziny nowożytnego świata (Wielkie odkrycia)',

        chapters: [
          'Współrzędne geograficzne i czytanie mapy',

    window.onload = function() {
      try {
        const savedUser = localStorage.getItem('akademia6a_saved_user');
        if (savedUser) {
          currentUser = JSON.parse(savedUser);
          document.getElementById('authScreen').style.display = 'none';
          initDashboard();
        }
      } catch(e) {}
      renderSubjects();
    };

    function toggleRecovery(show) {
      document.getElementById('loginForm').classList.toggle('hidden', show);
      document.getElementById('recoveryForm').classList.toggle('hidden', !show);
      document.getElementById('authSubtitle').innerText = show ? "Resetowanie PIN-u konta" : "Wpisz swój Nick i PIN, aby dołączyć!";
    }

    function forceLogin() {
      const n = document.getElementById('userNick').value.trim();
      const p = document.getElementById('userPin').value.trim();
      const a = document.getElementById('secAnswer').value.trim().toLowerCase();

      if (!n || !p) {
        alert("Wpisz Nick i PIN!");
        return;
      }

      currentUser = { nick: n, pin: p };

      try {
        localStorage.setItem('akademia6a_saved_user', JSON.stringify(currentUser));
      } catch(e) {}

      document.getElementById('authScreen').style.display = 'none';
      initDashboard();

      if (db) {
        db.collection("users_6a").doc(n).set({
          nick: n, pin: p, secAnswer: a, xp: 0, updatedAt: new Date()
        }, { merge: true }).catch(err => {});
      }
    }

    function resetPin() {
      const nick = document.getElementById('recNick').value.trim();
      const ans = document.getElementById('recAnswer').value.trim().toLowerCase();
      const newPin = document.getElementById('recNewPin').value.trim();

      if (!nick || !ans || newPin.length < 4) {
        alert("Wpisz Nick, odpowiedź i nowy 4-cyfrowy PIN!");
        return;
      }

      if (db) {
        db.collection("users_6a").doc(nick).get().then((doc) => {
          if (!doc.exists) { alert("Nie znaleziono takiego Nicku!"); return; }
          const data = doc.data();
          if (data.secAnswer === ans) {
            db.collection("users_6a").doc(nick).update({ pin: newPin });
            alert("PIN zmieniony! Zaloguj się nowym PIN-em.");
            toggleRecovery(false);
          } else {
            alert("Błędna odpowiedź na pytanie bezpieczeństwa!");
          }
        }).catch(e => alert("Błąd połączenia."));
      }
    }

    function logout() {
      if (confirm("Czy chcesz się wylogować?")) {
        try { localStorage.removeItem('akademia6a_saved_user'); } catch(e) {}
        location.reload();
      }
    }

    function initDashboard() {
      if (!currentUser) return;
      document.getElementById('profileNick').innerText = currentUser.nick;
      loadUserCloudData();
      renderLeaderboard();
      listenChallenges();
    }

    function loadUserCloudData() {
      let localXP = 0;
      try { localXP = parseInt(localStorage.getItem(`xp_${currentUser.nick}`)) || 0; } catch(e) {}
      userStats.xp = localXP;
      document.getElementById('xpDisplay').innerText = userStats.xp;

      if (db) {
        db.collection("users_6a").doc(currentUser.nick).get().then((doc) => {
          if (doc.exists) {
            userStats.xp = Math.max(userStats.xp, doc.data().xp || 0);
            document.getElementById('xpDisplay').innerText = userStats.xp;
          }
        }).catch(e => {});
      }
    }

    function addXP(points) {
      userStats.xp += points;
      document.getElementById('xpDisplay').innerText = userStats.xp;
      try { localStorage.setItem(`xp_${currentUser.nick}`, userStats.xp); } catch(e) {}

      if (db && currentUser) {
        db.collection("users_6a").doc(currentUser.nick).update({
          xp: userStats.xp, updatedAt: new Date()
        }).catch(e => {});
      }
    }

    function renderLeaderboard() {
      const lb = document.getElementById('leaderboard');
      const oppSel = document.getElementById('opponentSelect');
      if (!db) {
        lb.innerHTML = `<div class="col-span-3 text-center text-slate-500 font-bold p-2">Tryb lokalny.</div>`;
        return;
      }

      db.collection("users_6a").orderBy("xp", "desc").onSnapshot((snapshot) => {
        lb.innerHTML = "";
        oppSel.innerHTML = "";
        let rank = 1;

        snapshot.forEach((doc) => {
          const u = doc.data();
          if (rank <= 3) {
            const medals = ["🥇", "🥈", "🥉"];
            lb.innerHTML += `
              <div class="bg-white p-3 rounded-xl border border-amber-200 flex items-center justify-between shadow-sm">
                <span class="font-black text-slate-800">${medals[rank-1] || rank + "."} ${u.nick}</span>
                <span class="font-extrabold text-indigo-600">${u.xp} XP</span>
              </div>
            `;
          }
          if (u.nick !== currentUser.nick) {
            oppSel.innerHTML += `<option value="${u.nick}">${u.nick}</option>`;
          }
          rank++;
        });
      }, (err) => {
        lb.innerHTML = `<div class="col-span-3 text-center text-slate-500 font-bold p-2">Wczytywanie wyników...</div>`;
      });
    }

    function openChallengeModal() { document.getElementById('challengeModal').classList.remove('hidden'); }
    function closeChallengeModal() { document.getElementById('challengeModal').classList.add('hidden'); }

    function createChallenge() {
      const target = document.getElementById('opponentSelect').value;
      const subj = document.getElementById('challengeSubject').value;

      if (!target) { alert("Brak dostępnych przeciwników!"); return; }

      if (db) {
        db.collection("challenges_6a").add({
          from: currentUser.nick, to: target, subject: subj, status: 'pending', createdAt: new Date()
        }).then(() => {
          alert(`Wyzwanie 1 vs 1 dla ${target} wysłane!`);
          closeChallengeModal();
        });
      }
    }

    function listenChallenges() {
      if (!db) return;
      db.collection("challenges_6a").where("to", "==", currentUser.nick).where("status", "==", "pending")
        .onSnapshot((snapshot) => {
          const container = document.getElementById('activeChallengesContainer');
          const list = document.getElementById('challengesList');
          if (snapshot.empty) { container.classList.add('hidden'); return; }

          container.classList.remove('hidden');
          list.innerHTML = "";
          snapshot.forEach((doc) => {
            const ch = doc.data();
            list.innerHTML += `
              <div class="flex justify-between items-center bg-red-50 p-3 rounded-xl border border-red-200">
                <span class="font-bold text-sm text-red-900">⚔️ ${ch.from} wyzwał Cię z: ${program[ch.subject].title}!</span>
                <button onclick="acceptChallenge('${doc.id}', '${ch.subject}')" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-2 rounded-lg shadow">
                  Graj (+50 XP)
                </button>
              </div>
            `;
          });
        });
    }

    function acceptChallenge(id, subjKey) {
      activeChallengeId = id;
      isChallengeMode = true;
      startQuiz(`Pojedynek 1 vs 1: ${program[subjKey].title}`, subjKey);
    }

    function renderSubjects() {
      const grid = document.getElementById('subjectGrid');
      grid.innerHTML = "";
      for (let key in program) {
        const s = program[key];
        grid.innerHTML += `
          <button onclick="openSubject('${key}')" class="bg-white border border-slate-200 hover:border-indigo-500 p-6 rounded-2xl shadow-sm hover:shadow-md transition active:scale-95 text-center flex flex-col items-center">
            <span class="text-5xl mb-2">${s.icon}</span>
            <span class="font-bold text-slate-800 text-sm">${s.title}</span>
          </button>
        `;
      }
    }

    function showDashboard() {
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('chapterView').classList.add('hidden');
      document.getElementById('quizView').classList.add('hidden');
    }

    let activeSubjectKey = '';
    function openSubject(key) {
      activeSubjectKey = key;
      const subj = program[key];
      document.getElementById('chapterTitle').innerText = subj.title;
      const list = document.getElementById('chapterList');
      list.innerHTML = "";

      subj.chapters.forEach(chap => {
        list.innerHTML += `
          <div onclick="startQuiz('${chap}', '${key}')" class="bg-white p-4 rounded-2xl border border-slate-200 hover:border-indigo-500 shadow-sm cursor-pointer flex justify-between items-center font-bold">
            <span>${chap}</span>
            <span class="text-indigo-600">Rozpocznij ▶</span>
          </div>
        `;
      });

      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('chapterView').classList.remove('hidden');
    }

    function generateQuestionsForChapter(chapterName, subjKey) {
      let qList = [];

      if (subjKey === 'geografia') {
        if (chapterName.includes('czytanie mapy') || chapterName.includes('Współrzędne')) {
          qList.push({ 
            q: "Przeanalizuj poniższą mapę konturową Europy. Zaznaczony zielony obszar to:", 
            image: localVisuals.mapaEuropa,
            options: ["Polska", "Niemcy", "Ukraina"], 
            a: "Polska" 
          });
          qList.push({ q: "Które linie na globusie łączą bieguny?", options: ["Południki", "Równoleżniki", "Równik"], a: "Południki" });
        } else if (chapterName.includes('Ruchy Ziemi')) {
          qList.push({ 
            q: "Przeanalizuj poniższy schemat ruchu Ziemi wokół Słońca. Co powoduje ten ruch trwający 365 dni?", 
            image: localVisuals.ruchZiemi,
            options: ["Pory roku", "Dzień i noc", "Zaćmienie"], 
            a: "Pory roku" 
          });
          qList.push({ q: "Czas trwania jednego pełnego obrotu Ziemi wokół własnej osi to:", options: ["24 godziny", "365 dni", "30 dni"], a: "24 godziny" });
        } else {
          qList.push({ 
            q: "Spójrz na mapę fizyczną Polski. Główna, najdłuższa rzeka w kraju to:", 
            image: localVisuals.mapaPolska,
            options: ["Wisła", "Odra", "Warta"], 
            a: "Wisła" 
          });
          qList.push({ q: "Najwyższy szczyt w polskich górach (Tatry) to:", options: ["Rysy", "Giewont", "Śnieżka"], a: "Rysy" });
        }
      }
      else if (subjKey === 'biologia') {
        if (chapterName.includes('Stawonogi') || chapterName.includes('klasyfikacja')) {
          qList.push({ 
            q: "Przeanalizuj schemat budowy ciała owada. Ile par odnóży krocznych posiada typowy owad?", 
            image: localVisuals.budowaOwada,
            options: ["3 pary (6 odnóży)", "4 pary (8 odnóży)", "5 par"], 
            a: "3 pary (6 odnóży)" 
          });
          qList.push({ q: "Pająk krzyżak należy do grupy:", options: ["Pajęczaków", "Owadów", "Skorupiaków"], a: "Pajęczaków" });
        } else {
          qList.push({ q: "Które zwierzęta zaliczamy do stałocieplnych?", options: ["Ptaki i ssaki", "Ryby i płazy", "Gady i owady"], a: "Ptaki i ssaki" });
        }
      }
      else if (subjKey === 'technika') {
        if (chapterName.includes('znaki drogowe') || chapterName.includes('rowerowa')) {
          qList.push({ 
            q: "Co oznacza ten okrągły, niebieski znak drogowy z symbolem roweru?", 
            image: localVisuals.znakRower,
            options: ["Droga dla rowerów", "Zakaz wjazdu rowerów", "Uwaga rowerzyści"], 
            a: "Droga dla rowerów" 
          });
        } else {
          qList.push({ q: "Który materiał jest dobrym przewodnikiem prądu?", options: ["Miedź i aluminium", "Drewno i plastik", "Guma"], a: "Miedź i aluminium" });
        }
      }
      else if (subjKey === 'historia') {
        qList.push({ q: "W którym roku Krzysztof Kolumb odkrył Amerykę?", options: ["1492 rok", "1410 rok", "1569 rok"], a: "1492 rok" });
        qList.push({ q: "Konstytucja 3 maja została uchwalona w roku:", options: ["1791", "1772", "1795"], a: "1791" });
      }
      else if (subjKey === 'matematyka') {
        let v = (Math.floor(Math.random() * 6) + 4) * 10;
        let t = Math.floor(Math.random() * 3) + 2;
        let s = v * t;
        qList.push({ q: `Pojazd porusza się ze stałą prędkością ${v} km/h. Jaką drogę pokona w czasie ${t} godzin?`, options: [`${s} km`, `${s + 20} km`, `${s - 15} km`], a: `${s} km` });
        qList.push({ q: `Pociąg pokonał drogę 180 km w czasie 3 godzin. Z jaką średnią prędkością jechał?`, options: ["60 km/h", "50 km/h", "70 km/h"], a: "60 km/h" });
      }
      else {
        qList.push({ q: "Wybierz poprawną formę czasu przeszłego (Past Simple) dla czasownika 'GO':", options: ["went", "gone", "goed"], a: "went" });
        qList.push({ q: "Przetłumacz na język angielski słowo 'Pies':", isOpen: true, a: "dog" });
      }

      return qList;
    }

    function startQuiz(chapterName, subjKey) {
      currentQuiz = generateQuestionsForChapter(chapterName, subjKey || activeSubjectKey);
      currentQIdx = 0;
      
      document.getElementById('chapterView').classList.add('hidden');
      document.getElementById('quizView').classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      selectedOption = null;
      document.getElementById('feedbackBox').classList.add('hidden');
      const q = currentQuiz[currentQIdx];
      
      const pct = ((currentQIdx) / currentQuiz.length) * 100;
      document.getElementById('progressBar').style.width = pct + "%";

      const container = document.getElementById('questionContainer');
      let imgHtml = q.image ? `<div class="w-full flex justify-center mb-4 bg-white p-3 rounded-2xl border border-slate-300 shadow-inner"><img src="${q.image}" class="max-h-56 w-auto object-contain rounded-xl"></div>` : '';

      container.innerHTML = `
        <h3 class="text-lg font-black text-slate-800 mb-3">${q.q}</h3>
        ${imgHtml}
      `;

      if (q.isOpen) {
        container.innerHTML += `
          <input type="text" id="openAns" placeholder="Wpisz odpowiedź..." class="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold focus:outline-none focus:border-indigo-600">
        `;
      } else {
        q.options.forEach(opt => {
          container.innerHTML += `
            <button onclick="selectOpt(this, '${opt}')" class="opt-btn w-full text-left p-4 rounded-xl border border-slate-200 font-bold mb-2 hover:bg-indigo-50 transition">
              ${opt}
            </button>
          `;
        });
      }

      document.getElementById('nextBtn').innerText = "SPRAWDŹ ODPOWIEDŹ";
      document.getElementById('nextBtn').onclick = submitAnswer;
    }

    function selectOpt(btn, opt) {
      document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('border-indigo-600', 'bg-indigo-50'));
      btn.classList.add('border-indigo-600', 'bg-indigo-50');
      selectedOption = opt;
    }

    function submitAnswer() {
      const q = currentQuiz[currentQIdx];
      let userAns = q.isOpen ? document.getElementById('openAns').value.trim().toLowerCase() : selectedOption;

      if (!userAns) {
        alert("Wybierz lub wpisz odpowiedź!");
        return;
      }

      const fb = document.getElementById('feedbackBox');
      fb.classList.remove('hidden');

      if (userAns.toLowerCase() === q.a.toLowerCase()) {
        fb.className = "p-4 rounded-2xl mb-4 font-bold text-sm text-center bg-emerald-100 text-emerald-800 border border-emerald-300";
        fb.innerText = "🎉 Świetnie! Poprawna odpowiedź!";
        addXP(10);
      } else {
        fb.className = "p-4 rounded-2xl mb-4 font-bold text-sm text-center bg-rose-100 text-rose-800 border border-rose-300";
        fb.innerText = `❌ Pomyłka! Prawidłowa odpowiedź to: ${q.a}`;
      }

      document.getElementById('nextBtn').innerText = "NASTĘPNE ZADANIE ▶";
      document.getElementById('nextBtn').onclick = nextQuestion;
    }

    function nextQuestion() {
      currentQIdx++;
      if (currentQIdx < currentQuiz.length) {
        renderQuestion();
      } else {
        if (isChallengeMode) {
          addXP(50);
          if (db && activeChallengeId) {
            db.collection("challenges_6a").doc(activeChallengeId).update({ status: 'completed' });
          }
          alert("🏆 Wyzwanie 1 vs 1 zakończone sukcesem! Zdobycz: +50 BONUSOWYCH XP!");
          isChallengeMode = false;
        } else {
          alert("Gratulacje! Ukończyłeś test z tego działu!");
        }
        showDashboard();
      }
    }
  </script>
</body>
</html>
