<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akademia 6A</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- EKRAN LOGOWANIA -->
  <div id="authScreen" class="fixed inset-0 bg-indigo-950 bg-opacity-95 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center">
      <div class="text-5xl mb-3">⚡</div>
      <h1 class="text-3xl font-black text-indigo-950 mb-1">AKADEMIA 6A</h1>
      <p class="text-slate-500 text-sm mb-6">Wpisz swój Nick i PIN, aby dołączyć!</p>

      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nick ucznia:</label>
          <input type="text" id="userNick" placeholder="Np. Karol_SP7" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">PIN (4 cyfry):</label>
          <input type="password" id="userPin" maxlength="4" placeholder="****" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800 text-center tracking-widest">
        </div>
        <button type="button" onclick="startApp()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition active:scale-95 text-center block mt-4">
          ROZPOCZNIJ NAUKĘ 🚀
        </button>
      </div>
    </div>
  </div>

  <!-- PANELS GŁÓWNY -->
  <header class="bg-indigo-950 text-white p-4 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-2xl">⚡</span>
      <span class="font-black tracking-wider text-lg">AKADEMIA 6A</span>
    </div>
    <div class="flex items-center gap-3">
      <div class="bg-amber-500/20 border border-amber-400 px-3 py-1 rounded-full text-amber-300 font-extrabold text-sm">🔥 1 d.</div>
      <div class="bg-indigo-800/60 border border-indigo-400 px-3 py-1 rounded-full text-amber-300 font-extrabold text-sm">⭐ <span id="xpVal">0</span> XP</div>
      <span id="nickVal" class="text-xs bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-600 font-bold">Uczeń</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">
    <h2 class="text-xl font-black text-slate-800 mb-4 mt-2">Wybierz przedmiot:</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="grid">
      <button onclick="quiz('Angielski')" class="bg-white border p-6 rounded-2xl shadow-sm text-center flex flex-col items-center"><span class="text-5xl mb-2">🇬🇧</span><span class="font-bold">Język Angielski</span></button>
      <button onclick="quiz('Matematyka')" class="bg-white border p-6 rounded-2xl shadow-sm text-center flex flex-col items-center"><span class="text-5xl mb-2">📐</span><span class="font-bold">Matematyka</span></button>
      <button onclick="quiz('Historia')" class="bg-white border p-6 rounded-2xl shadow-sm text-center flex flex-col items-center"><span class="text-5xl mb-2">⚔️</span><span class="font-bold">Historia</span></button>
      <button onclick="quiz('Geografia')" class="bg-white border p-6 rounded-2xl shadow-sm text-center flex flex-col items-center"><span class="text-5xl mb-2">🌍</span><span class="font-bold">Geografia</span></button>
      <button onclick="quiz('Biologia')" class="bg-white border p-6 rounded-2xl shadow-sm text-center flex flex-col items-center"><span class="text-5xl mb-2">🌿</span><span class="font-bold">Biologia</span></button>
      <button onclick="quiz('Technika')" class="bg-white border p-6 rounded-2xl shadow-sm text-center flex flex-col items-center"><span class="text-5xl mb-2">🛠️</span><span class="font-bold">Technika</span></button>
    </div>
  </main>

  <script>
    function startApp() {
      const nick = document.getElementById('userNick').value.trim();
      const pin = document.getElementById('userPin').value.trim();
      if (!nick || !pin) {
        alert('Wpisz Nick i PIN!');
        return;
      }
      document.getElementById('nickVal').innerText = nick;
      document.getElementById('authScreen').classList.add('hidden');
    }

    function quiz(subject) {
      alert('Wyzwanie z przedmiotu ' + subject + ' działa pomyślnie!');
    }
  </script>
</body>
</html>
