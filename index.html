<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akademia 6A</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Akademia 6A">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col select-none">

  <!-- KONFIGURACJA FIREBASE -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDpe9cwQywFTFzNoC6ovSPAzLjS8_pjsRQ",
      authDomain: "akademia-6a.firebaseapp.com",
      projectId: "akademia-6a",
      storageBucket: "akademia-6a.firebasestorage.app",
      messagingSenderId: "547146287604",
      appId: "1:547146287604:web:53c5efa8b29383a77dd1a1"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {
      console.log("Firebase offline");
    }
  </script>

  <!-- EKRAN LOGOWANIA I ODZYSKIWANIA HASŁA -->
  <div id="authScreen" class="fixed inset-0 bg-indigo-950 bg-opacity-95 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center">
      <div class="text-5xl mb-3">⚡</div>
      <h1 class="text-3xl font-black text-indigo-950 mb-1">AKADEMIA 6A</h1>
      <p class="text-slate-500 text-sm mb-6" id="authSubtitle">Wpisz swój Nick i PIN, aby dołączyć!</p>

      <!-- FORMULARZ LOGOWANIA -->
      <div id="loginForm" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nick ucznia:</label>
          <input type="text" id="userNick" placeholder="Np. Karol_SP7" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">PIN (4 cyfry):</label>
          <input type="password" id="userPin" maxlength="4" placeholder="****" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800 text-center tracking-widest">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Pytanie bezpieczeństwa (do odzyskania PIN):</label>
          <select id="secQuestion" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-semibold text-xs text-slate-700 focus:outline-none mb-2">
            <option value="pet">Imię pierwszego zwierzaka?</option>
            <option value="color">Twój ulubiony kolor?</option>
            <option value="hero">Twój ulubiony superbohater?</option>
          </select>
          <input type="text" id="secAnswer" placeholder="Odpowiedź..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-xs text-slate-800">
        </div>
        <button type="button" onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition active:scale-95 text-center block mt-4">
          ROZPOCZNIJ NAUKĘ 🚀
        </button>
        <div class="text-center mt-3">
          <button type="button" onclick="toggleRecovery(true)" class="text-xs text-indigo-600 hover:underline font-bold">Zapomniałeś PIN-u?</button>
        </div>
      </div>

      <!-- FORMULARZ ODZYSKIWANIA PIN-U -->
      <div id="recoveryForm" class="space-y-4 text-left hidden">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Wpisz swój Nick:</label>
          <input type="text" id="recNick" placeholder="Twój Nick" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Odpowiedź na pytanie bezpieczeństwa:</label>
          <input type="text" id="recAnswer" placeholder="Wpisz odpowiedź..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Ustal NOWY PIN (4 cyfry):</label>
          <input type="password" id="recNewPin" maxlength="4" placeholder="****" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:outline-none font-bold text-slate-800 text-center tracking-widest">
        </div>
        <button type="button" onclick="resetPin()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition active:scale-95 text-center block mt-2">
          ZMIEŃ PIN I ZALOGUJ 🔑
        </button>
        <div class="text-center mt-2">
          <button type="button" onclick="toggleRecovery(false)" class="text-xs text-slate-500 hover:underline font-bold">Powrót do logowania</button>
        </div>
      </div>

    </div>
  </div>

  <!-- NAGŁÓWEK GŁÓWNY -->
  <header class="bg-indigo-950 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2 cursor-pointer" onclick="showDashboard()">
        <span class="text-2xl">⚡</span>
        <span class="font-black tracking-wider text-lg">AKADEMIA 6A</span>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1 bg-amber-500/20 border border-amber-400 px-3 py-1 rounded-full text-amber-300 font-extrabold text-sm">
          🔥 <span id="streakDisplay">1</span> d.
        </div>
        <div class="flex items-center gap-1 bg-indigo-800/60 border border-indigo-400 px-3 py-1 rounded-full text-amber-300 font-extrabold text-sm">
          ⭐ <span id="xpDisplay">0</span> XP
        </div>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-600 font-bold">
          ⚙️ <span id="profileNick">Uczeń</span>
        </button>
      </div>
    </div>
  </header>

  <!-- KONTENER GŁÓWNY -->
  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">

    <div id="dashboardView">
      <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-extrabold text-amber-900 flex items-center gap-2">
            🏆 LIGA KLASY 6A (TOP LIDERZY)
          </h2>
          <span class="text-xs text-amber-700 font-bold">Chmura Firebase</span>
        </div>
        <div id="leaderboard" class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
          <div class="bg-white p-3 rounded-xl border border-amber-200 text-center font-bold text-slate-500 col-span-3">
            Ładowanie wyników klasy 6A...
          </div>
        </div>

        <button onclick="openChallengeModal()" class="w-full bg-gradient-to-r from-red-500 to-amber-500 hover:from-red-600 hover:to-amber-600 text-white font-black py-3 rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
          ⚔️ Wyzwanie 1 vs 1 (Pojedynek z kolegą)
        </button>
      </div>

      <div id="activeChallengesContainer" class="hidden mb-6 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <h3 class="font-black text-slate-800 mb-3 text-sm flex items-center gap-2">
          🎯 RZUCONE WYZWANIA 1 vs 1 INNYCH GRACZY:
        </h3>
        <div id="challengesList" class="space-y-2"></div>
      </div>

      <h2 class="text-xl font-black text-slate-800 mb-4">Wybierz przedmiot do nauki:</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8" id="subjectGrid"></div>
    </div>

    <!-- MODAL TWORZENIA WYZWANIA -->
    <div id="challengeModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-black text-lg text-slate
