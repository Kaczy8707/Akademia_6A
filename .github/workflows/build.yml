name: Build Akademia SP7 (Windows & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Przygotowanie i kompilacja APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -not -path "*/.*/*" | head -n 1))
          cd "$PROJECT_DIR"
          mkdir -p assets/mapy
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Akademia_SP7_Android_APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Przygotowanie i kompilacja EXE
        shell: pwsh
        run: |
          $pubspec = Get-ChildItem -Recurse -Filter "pubspec.yaml" | Select-Object -First 1
          $projectDir = $pubspec.DirectoryName
          Set-Location $projectDir
          New-Item -ItemType Directory -Force -Path "assets/mapy"
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: Akademia_SP7_Windows_EXE
          path: "**/build/windows/x64/runner/Release/"
